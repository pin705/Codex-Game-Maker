name: Validate Codex Game Maker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python tooling
        run: python -m compileall -q plugins/codex-game-maker/scripts evals tests

      - name: Run all unit and adversarial tests
        run: python -m unittest discover -v tests

      - name: Validate evaluation corpus
        run: python evals/run_eval.py validate

      - name: Validate repository structure
        run: python tests/validate_repository.py

      - name: Validate every skill
        shell: pwsh
        run: |
          Get-ChildItem plugins/codex-game-maker/skills -Directory | ForEach-Object {
            python tests/quick_validate_skill.py $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate plugin contract
        run: python tests/validate_plugin_contract.py plugins/codex-game-maker

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem plugins/codex-game-maker -Recurse -Filter *.ps1 | ForEach-Object {
            try { [void][scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName)) }
            catch { Write-Error "$($_.FullName): $($_.Exception.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Verify asset dependencies
        shell: pwsh
        run: ./plugins/codex-game-maker/tools/check-asset-tools.ps1

      - name: Check whitespace
        run: git diff --check
