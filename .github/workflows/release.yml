name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and package
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CODEX_CLI_VERSION: "0.143.0"

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install checksum-verified Godot and templates
        run: python plugins/codex-game-maker/scripts/install_godot.py --with-export-templates
      - name: Import, run, and export the real Godot fixture
        run: python tests/run_godot_smoke.py
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-godot-smoke-${{ matrix.os }}
          path: tests/fixtures/godot-smoke/build
          if-no-files-found: warn

  release:
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python tests/verify_godot_policy_source.py
      - run: python -m unittest discover -v tests
      - run: python tests/validate_repository.py
      - run: python tests/validate_plugin_contract.py plugins/codex-game-maker
      - name: Validate every skill
        run: |
          for skill in plugins/codex-game-maker/skills/*; do
            python tests/quick_validate_skill.py "$skill"
          done
      - name: Validate stable release metadata
        run: python tests/validate_release.py --tag "$RELEASE_TAG"
      - name: Clean install through Codex marketplace
        run: |
          npm install --global "@openai/codex@$CODEX_CLI_VERSION"
          codex plugin marketplace add "https://github.com/${GITHUB_REPOSITORY}" --ref "$RELEASE_TAG"
          codex plugin add codex-game-maker@codex-game-maker
          codex plugin marketplace upgrade codex-game-maker
          codex plugin add codex-game-maker@codex-game-maker
          codex plugin list --marketplace codex-game-maker | tee codex-plugin-list.txt
          grep -F "codex-game-maker@codex-game-maker" codex-plugin-list.txt
      - name: Build immutable release artifacts
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-game-maker-release
          path: dist/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Codex Game Maker $GITHUB_REF_NAME"
