activation:
  type: natural-language-alias
  note: "Aliases such as /release and /team-ui are explicit professional-mode triggers. They are not required for the default flow and can later map to true slash commands if Codex supports them."

commands:
  - alias: /release
    mode: professional
    recommended_skill: game-studio-review
    purpose: "Prepare release checklist, changelog, build evidence, and launch readiness."
    default_status: available

  - alias: /hotfix
    mode: professional
    recommended_skill: game-studio-review
    purpose: "Triage a released build bug, make the smallest patch, and run focused verification."
    default_status: available

  - alias: /team-ui
    mode: professional
    recommended_skill: game-studio-review
    purpose: "Coordinate UI/UX, Godot Control implementation, art consistency, and QA review."
    default_status: planned

  - alias: /team-level
    mode: professional
    recommended_skill: game-studio-review
    purpose: "Coordinate level design, implementation, art readability, and playtest evidence."
    default_status: planned

  - alias: /team-combat
    mode: professional
    recommended_skill: game-studio-review
    purpose: "Coordinate combat rules, implementation, feedback, tuning, and QA."
    default_status: planned

  - alias: /audio-pass
    mode: professional
    recommended_skill: game-studio-art-assets
    purpose: "Plan music/SFX needs, source or generate audio briefs, and define trigger points."
    default_status: planned

  - alias: /narrative-pass
    mode: professional
    recommended_skill: game-studio-design
    purpose: "Review story, dialogue, worldbuilding, and narrative delivery."
    default_status: planned

  - alias: /localization-pass
    mode: professional
    recommended_skill: game-studio-review
    purpose: "Check text surfaces, font risks, string length, and localization readiness."
    default_status: planned

  - alias: /accessibility-pass
    mode: professional
    recommended_skill: game-studio-review
    purpose: "Check input remapping, color/readability, subtitles, difficulty assists, and motion comfort."
    default_status: planned

  - alias: /hooks-on
    mode: professional
    recommended_skill: game-studio-review
    purpose: "Install optional professional git hooks for gate automation."
    default_status: available
