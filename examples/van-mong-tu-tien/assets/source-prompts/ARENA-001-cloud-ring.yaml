prompt_reconstruction: |
  Original premium 2D xianxia combat arena painted in Chinese ink wash on warm
  xuan paper, wide 16:9 and viewed from high top-down. A large calm parchment
  fighting floor occupies the center, with a restrained circular ward seal;
  broken blue-black cliff shelves, cloud falls, pine silhouettes, aged bronze
  ward posts, sparse jade pools and tiny cinnabar foliage frame the perimeter.
  Keep the central majority light, uncluttered and readable for dense survivor
  combat. Handmade dry/wet brush edges, mineral pigment and paper grain; no
  baked characters, enemies, pickups, projectiles, UI, health bars or text.
negative_constraints:
  - "no words, calligraphy, labels, logo, watermark, UI or debug grid"
  - "no characters, monsters, weapons, pickups, spell effects or cast shadows"
  - "no glossy 3D render, plastic terrain, neon cyberpunk or photoreal scene"
  - "no perspective corridor, dominant building or clutter across the central combat field"
