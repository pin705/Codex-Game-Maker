prompt: |
  Use case: stylized-concept
  Asset type: production-ready animated enemy sprite sheet for a top-down arena action game
  Primary request: Create ONE original hostile corrupted cultivator called “Tà Tu” as a six-frame looping pursuit/idle animation, arranged as an exact 2-row by 3-column sprite sheet. The same character and costume must be preserved in every frame.
  Scene/backdrop: perfectly flat, uniform solid #FF00FF chroma-key background across the entire canvas and every cell; no floor, no cast shadow, no paper texture in the background, no gradient, no border, no grid lines, no separators.
  Subject: an upright but predatory forward-leaning corrupted cultivator, clearly non-player and humanoid. Angular narrow silhouette, hunched shoulders, split short robe hem with two visible grounded feet, elongated blue-black sleeves, ragged dry-brush ink smoke growing from the upper back and robe edges. A simple pale xuan-paper mask plane with two tiny cinnabar-red slit eyes; one small broken cinnabar seal patch on the chest with NO glyph or writing; one sparse aged-bronze belt clasp and bronze thread accents. No weapon. The silhouette must be different from a round spirit/wisp and from the heroic player.
  Style/medium: premium 2D Chinese ink-wash and mineral-pigment game sprite painted on xuan paper, then cleanly isolated; wet blue-black pooling, dry-brush frayed edges, restrained pale paper planes, sparse cinnabar and aged bronze. Authored hand-painted commercial indie quality, not vector art, not 3D, not anime-gacha, not glossy.
  Camera/view: three-quarter top-down arena view, character generally facing toward screen-right with the mask still readable. Full body visible in every frame.
  Animation/layout: exact 2x3 layout, left-to-right then top-to-bottom. Six distinct but subtle connected phases: (1) grounded hostile neutral lean, (2) inhale/robe lift and left-foot weight, (3) mask dip and right sleeve pull, (4) opposite-foot weight with ink tails curling back, (5) brief cinnabar eye/seal pressure pulse without glow, (6) settle returning cleanly to frame 1. Real cloth/smoke motion, stable torso size and stable foot baseline; no whole-body wobble or scale popping.
  Composition/framing: six equal large cells with very generous padding. Each complete character stays centered on a common bottom/feet anchor, occupies roughly 55–65% of cell height, and stays at least 14% of cell size away from every cell edge. No body part, brush tail, sleeve, smoke, or ornament may cross a cell boundary. Keep neighboring silhouettes clearly separated.
  Color palette: deep ink #0B171B, #17292D and desaturated blue-black #314248; pale mask #E7DDC4; cinnabar #B43D35/#E06B52 only for eyes and seal patch; aged bronze #8A6730/#C69A48 used sparingly. Do not use magenta or hot pink anywhere in the subject.
  Technical constraints: opaque sprite shapes suitable for chroma-key removal; crisp readable alpha silhouette; internal brush texture must survive at 64–80 logical pixels tall; consistent baked soft upper-left light; no translucent glow or semi-transparent smoke; no motion blur; no shadow; no detached debris; no labels; no text; no calligraphy; no pseudo-Chinese characters; no watermark; no logo.
  Avoid: generic ghost blob, round wisp, cute mascot, heroic posture, long floor-length robe hiding both feet, extra limbs, duplicated face, anatomy drift, changing mask shape, costume drift, scale drift, cropped parts, visible grid, poster composition, plastic rendering.
negative_constraints:
  - "no text, calligraphy, pseudo-Chinese characters, labels, borders, grid, logo or watermark"
  - "no glossy 3D, neon, generic anime-gacha finish, vector dashboard art or plastic shading"
  - "no aura, glow, floor shadow, translucent smoke, dust or motion blur baked into the body sheet"
  - "no round wisp silhouette, heroic posture, extra limbs, duplicate face, scale pop or cell crossing"
