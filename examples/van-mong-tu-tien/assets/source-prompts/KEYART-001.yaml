  Use case: stylized-concept
  Asset type: game title-screen key art, wide 16:9 landscape
  Primary request: an original xianxia cultivation arena titled only in the UI later; the image itself contains no words
  Scene/backdrop: a vast sea of clouds and distant ink mountains painted on warm xuan paper
  Subject: one small, original sword cultivator on a crescent cloud-island in the lower center, surrounded by exactly nine cyan-jade flying swords forming a clear spiral; a colossal horned ink spirit emerges from the upper cloud layer
  Style/medium: premium 2D Chinese ink-wash game illustration, dry-brush edges, handmade paper grain, restrained jade-cyan, gold and vermilion accents; painterly, not photorealistic and not a 3D render
  Composition/framing: wide 16:9 cinematic composition; focal content stays within the central 80 percent; preserve a calm, clean upper-left area for a separate runtime title; strong readable silhouettes at thumbnail size
  Lighting/mood: misty dawn, contemplative but dangerous, bright jade sword glow cutting through deep blue-black ink
  Color palette: warm ivory paper, indigo-black ink, jade cyan safety glow, muted vermilion threat accents, small gold breakthrough accents
  Constraints: original character and creature design; no text, letters, calligraphy, logo, watermark, UI, border, frame, modern building, copied franchise character, extra limbs, neon cyberpunk, dense clutter
