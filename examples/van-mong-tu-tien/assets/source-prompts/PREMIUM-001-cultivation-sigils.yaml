schema: "codex-game-maker.asset-prompt-spec.v2"
asset_id: PREMIUM-001-cultivation-sigils
name: "Phi Kiếm, Hộ Thể Ngọc and Tụ Linh gameplay sigils"
category: vfx
asset_kind: ui_icon_family
intended_use: >-
  Three standalone painted discipline marks used by loadout, permanent
  techniques, breakthrough choices, touch skill control and portrait guard.
target_engine: "Godot 4.4"
target_display_size: "approximately 40x40 through 200x200 logical pixels"
runtime_role: "Primary technique identity art; never a frame, badge or button."

