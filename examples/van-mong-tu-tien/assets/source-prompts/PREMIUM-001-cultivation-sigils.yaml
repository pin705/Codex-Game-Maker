  record_status: "recovered_from_local_codex_session_log_and_verified_project_files"
  generation_provider: gpt_image
  execution_surface: "Codex built-in image_gen"
  provider_request_id: "unknown_not_exposed"
  provider_asset_id: "unknown_not_exposed"
  model_identifier: "unknown_not_exposed"
  seed: "unknown_not_exposed"
  codex_session_id: "019facc5-d657-7251-922d-55cd7d52c651"
  session_log_scope: "local Codex session evidence; not a provider receipt"
  legacy_prompt_copy: "assets/generated/vfx/PREMIUM-001-cultivation-sigils/PROMPTS.md"
  source_note: >-
    Prompt text was checked against both the committed PROMPTS.md and the local
    session calls. Codex call IDs and output-hint IDs are recorded separately
    from provider IDs, which were not exposed.

source_design:
  concept: "design/gdd/game-concept.md"
  art_bible: "design/art/art-bible.md"
  ui_spec: "design/ui/ui-ux-spec.md"

