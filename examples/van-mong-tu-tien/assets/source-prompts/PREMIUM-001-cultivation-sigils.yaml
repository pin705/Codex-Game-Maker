  family_id: "cultivation-sigils"
  identity_anchors:
    - "one strong standalone silhouette per discipline"
    - "cinematic xianxia ink mark rather than inventory badge"
    - "readable at 40, 64 and 128 pixels"
  material_anchors:
    - "opaque mineral-pigment brushwork"
    - "confident dry-brush edges"
