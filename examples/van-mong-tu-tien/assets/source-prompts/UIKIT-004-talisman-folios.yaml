      Constraints: keep a perfectly flat uniform #ff00ff background; full isolated silhouette with at least 8% canvas padding; no shadow, glow, text, calligraphy, runes, logo, ornament, gem, filigree, extra pins, extra objects, or new decoration. Do not restyle. Change only width/proportions and re-center.

