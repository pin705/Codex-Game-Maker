        identity: "sword_initial output"
        codex_output_hint_id: "exec-032f2c9f-c020-4430-b79a-4ded7b0e9cc9.png"
    prompt: |
      Use case: precise-object-edit
      Asset type: production game UI talisman folio
      Input images: Image 1 is the edit target.
      Primary request: Change ONLY the component proportions so this reads as a usable broad upgrade-card folio rather than a narrow bookmark. Expand the paper body to occupy about 78% of the canvas width and 82% of the canvas height. Preserve its asymmetric diagonal shoulder, folded paper lip, broken lower notch, two tiny bronze pins, paper/ink materials, palette, flat magenta background, and all negative constraints. The protected blank text area must be at least 68% of the component width and remain calm.
      Constraints: keep a perfectly flat uniform #ff00ff background; keep the full silhouette isolated with at least 8% canvas padding on every side; no shadow, glow, text, calligraphy, runes, logo, border ornament, gem, filigree, extra pins, extra objects, or new decoration. Do not restyle. Change only the width/proportions and re-center the component.

  - operation_id: jade_broad_edit
