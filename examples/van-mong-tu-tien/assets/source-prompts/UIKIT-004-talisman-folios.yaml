      Constraints: opaque component with crisp removable edges; no semi-transparent smoke; no cast shadow; no glow; no letters, numerals, calligraphy, pseudo-characters, runes, logo, watermark, medallion, closed badge, bevel, gem, filigree, fantasy frame, cloud corners, scroll rollers, clasp, decorative border, shield shape, or multiple objects. Do not use pure #0000ff anywhere inside the component.
      Avoid: generic mobile RPG card, HTML/SaaS rectangle, glossy 3D, plastic, gacha ornament, stock vector UI, narrow bookmark proportions.

postprocess:
  processor: "/Users/bon/.codex/skills/.system/imagegen/scripts/remove_chroma_key.py"
  initial_selected_sources:
    parameters:
      auto_key: border
      soft_matte: true
      transparent_threshold: 12
      opaque_threshold: 220
      despill: true
      edge_contract: 1
    applies_to:
      - "source/folio-sword-chroma.png -> runtime/folio_sword.png"
      - "source/folio-jade-chroma.png -> runtime/folio_jade.png"
      - "source/folio-spirit-chroma.png -> superseded pre-v2 runtime output"
  spirit_v2:
    parameters:
      auto_key: border
      soft_matte: true
      transparent_threshold: 12
      opaque_threshold: 180
      despill: true
      edge_contract: 1
      force: true
    mapping: "source/folio-spirit-chroma-v2.png -> runtime/folio_spirit.png"
  final_trim:
    command_contract: "ImageMagick: -trim +repage, in place"
    consequence: >-
      Runtime folios are tight alpha crops. Their transparent safe margin is
      therefore zero and their nonzero alpha touches one or more canvas edges.

output:
  selected_sources:
    - "assets/generated/ui/UIKIT-004-talisman-folios/source/folio-sword-chroma.png"
    - "assets/generated/ui/UIKIT-004-talisman-folios/source/folio-jade-chroma.png"
    - "assets/generated/ui/UIKIT-004-talisman-folios/source/folio-spirit-chroma-v2.png"
  superseded_sources:
    - "assets/generated/ui/UIKIT-004-talisman-folios/source/folio-spirit-chroma.png"
  runtime_files:
    - "assets/generated/ui/UIKIT-004-talisman-folios/runtime/folio_sword.png"
    - "assets/generated/ui/UIKIT-004-talisman-folios/runtime/folio_jade.png"
    - "assets/generated/ui/UIKIT-004-talisman-folios/runtime/folio_spirit.png"
  pipeline_meta: "assets/generated/ui/UIKIT-004-talisman-folios/pipeline-meta.json"
  status: accepted_integrated_verified_native

known_unknowns:
  - "The built-in image provider request ID, provider asset ID, model identifier and seed were not exposed."
  - "The three unedited initial outputs were not copied into the project; their Codex output-hint IDs remain recorded above."
