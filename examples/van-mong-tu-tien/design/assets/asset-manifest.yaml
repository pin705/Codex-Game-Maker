release_note: >-
  Combat, three environments, hub and the V3 authored UI families now have a
  clean Godot 4.6.2 parse, current desktop/844x390 native captures and a fresh
  served Chromium export. UIKIT-007 includes the live boss-bar binding;
  UIKIT-008 supplies distinct control silhouettes; PORTRAIT-001/002 and
  ACHIEVEICON-001 supply dedicated dossier, HUD and achievement identity art.
  Independent visual review, physical mobile, cross-browser, audio listening
  and human feel/balance gates remain open, so the complete game is not
  declared player-ready, release-ready or commercial-ready.

