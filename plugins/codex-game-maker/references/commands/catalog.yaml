activation:
  type: natural-language-alias
  note: "A broad make/build/finish request already defaults to player-ready. /player-ready makes that target explicit; aliases such as /release and /team-ui select focused professional passes."

commands:
  - alias: /player-ready
    mode: end-to-end
    recommended_skill: game-studio-build
    purpose: "Build or continue the complete bounded game through gameplay, assets, UI, audio, tests, runtime evidence, and manual playtest."
    default_status: available

  - alias: /release
    mode: professional
    recommended_skill: game-studio-review
    purpose: "Prepare platform builds, release checklist, changelog, licensing, performance, packaging evidence, and launch readiness after player-ready passes."
    default_status: available

  - alias: /hotfix
    mode: professional
    recommended_skill: game-studio-review
    purpose: "Triage a released build bug, make the smallest patch, and run focused verification."
    default_status: available

  - alias: /team-ui
    mode: professional
    recommended_skill: game-studio-ui-ux
    purpose: "Design, implement, capture, and QA game-native HUD, menus, controls presentation, responsive layouts, focus, and accessibility."
    default_status: available

  - alias: /team-level
    mode: professional
    recommended_skill: game-studio-implementation
    purpose: "Implement complete level paths, encounters, environment integration, transitions, and playtest evidence."
    default_status: available

  - alias: /team-combat
    mode: professional
    recommended_skill: game-studio-implementation
    purpose: "Implement combat rules, controls, enemies, feedback, tuning, terminal states, tests, and playtest evidence."
    default_status: available

  - alias: /audio-pass
    mode: professional
    recommended_skill: game-studio-audio
    purpose: "Inventory, create or source, integrate, mix, expose settings for, and verify music, ambience, UI, and gameplay audio."
    default_status: available

  - alias: /narrative-pass
    mode: professional
    recommended_skill: game-studio-design
    purpose: "Review story, dialogue, worldbuilding, and narrative delivery."
    default_status: planned

  - alias: /localization-pass
    mode: professional
    recommended_skill: game-studio-review
    purpose: "Check text surfaces, font risks, string length, and localization readiness."
    default_status: planned

  - alias: /accessibility-pass
    mode: professional
    recommended_skill: game-studio-ui-ux
    purpose: "Check input remapping, focus, color/readability, text scale, subtitles, difficulty assists, and motion comfort."
    default_status: available

  - alias: /hooks-on
    mode: professional
    recommended_skill: game-studio-review
    purpose: "Install optional professional git hooks for gate automation."
    default_status: available
